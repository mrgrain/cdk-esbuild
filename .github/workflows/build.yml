name: build
on:
  pull_request: {}
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      self_mutation_happened: ${{ steps.self_mutation.outputs.self_mutation_happened }}
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 18.x
      - name: Install dependencies
        run: npm install
      - name: build
        run: npx projen build
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - name: Update Pipfile.lock
        run: |-
          npx projen package:python
          pip install pipenv
          pipenv lock
      - uses: actions/setup-go@v5
        with:
          go-version: ^1.18.0
      - name: Update go.mod
        run: |-
          npx projen package:go
          go mod tidy
      - name: Find mutations
        id: self_mutation
        run: |-
          git add .
          git diff --staged --patch --exit-code > repo.patch || echo "self_mutation_happened=true" >> $GITHUB_OUTPUT
        shell: bash
        working-directory: ./
      - name: Upload patch
        if: steps.self_mutation.outputs.self_mutation_happened
        uses: actions/upload-artifact@v4.6.2
        with:
          name: repo.patch
          path: repo.patch
          overwrite: true
      - name: Fail build on mutation
        if: steps.self_mutation.outputs.self_mutation_happened
        run: |-
          echo "::error::Files were changed during build (see build log). If this was triggered from a fork, you will need to update your branch."
          cat repo.patch
          exit 1
      - name: Backup artifact permissions
        run: cd dist && getfacl -R . > permissions-backup.acl
        continue-on-error: true
      - name: Upload artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: build-artifact
          path: dist
          overwrite: true
  self-mutation:
    needs: build
    runs-on: ubuntu-latest
    if: always() && needs.build.outputs.self_mutation_happened && github.event_name == 'pull_request'
    steps:
      - name: Generate token
        id: generate_token
        uses: actions/create-github-app-token@3ff1caaa28b64c9cc276ce0a02e2ff584f3900c5
        with:
          app-id: ${{ secrets.PROJEN_APP_ID }}
          private-key: ${{ secrets.PROJEN_APP_PRIVATE_KEY }}
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ steps.generate_token.outputs.token }}
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
      - name: Check if can push to PR
        id: check-push
        env:
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}
          FORK_FULL_NAME: ${{ github.event.pull_request.head.repo.full_name }}
          IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: |-
          # Check if we have push permissions to the base repository
          BASE_PERMS=$(gh api repos/${{ github.repository }} 2>/dev/null | jq '.permissions.push // false')

          if [ "$IS_FORK" = "true" ]; then
            # For forks, check if maintainer can modify and we have base permissions
            MAINTAINER_CAN_MODIFY=$(gh pr view ${{ github.event.number }} --json maintainerCanModify --jq '.maintainerCanModify // false')
            
            if [ "$BASE_PERMS" = "true" ] && [ "$MAINTAINER_CAN_MODIFY" = "true" ]; then
              echo "can-push=true" >> $GITHUB_OUTPUT
            else
              # Fall back to checking permissions on the fork repository
              FORK_PERMS=$(gh api "repos/$FORK_FULL_NAME" 2>/dev/null | jq '.permissions.push // false')
              echo "can-push=$FORK_PERMS" >> $GITHUB_OUTPUT
            fi
          else
            # For same repository PRs, use base repository permissions
            echo "can-push=$BASE_PERMS" >> $GITHUB_OUTPUT
          fi
      - name: Download patch
        uses: actions/download-artifact@v5
        with:
          name: repo.patch
          path: ${{ runner.temp }}
        if: steps.check-push.outputs.can-push == 'true'
      - name: Apply patch
        run: '[ -s ${{ runner.temp }}/repo.patch ] && git apply ${{ runner.temp }}/repo.patch || echo "Empty patch. Skipping."'
        if: steps.check-push.outputs.can-push == 'true'
      - name: Set git identity
        run: |-
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
        if: steps.check-push.outputs.can-push == 'true'
      - name: Push changes
        env:
          PULL_REQUEST_REF: ${{ github.event.pull_request.head.ref }}
        run: |-
          git add .
          git commit -s -m "chore: self mutation"
          git push origin "HEAD:$PULL_REQUEST_REF"
        if: steps.check-push.outputs.can-push == 'true'
  package-js:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: ${{ !needs.build.outputs.self_mutation_happened }}
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 18.x
      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          name: build-artifact
          path: dist
      - name: Restore build artifact permissions
        run: cd dist && setfacl --restore=permissions-backup.acl
        continue-on-error: true
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          path: .repo
      - name: Install Dependencies
        run: cd .repo && npm ci
      - name: Extract build artifact
        run: tar --strip-components=1 -xzvf dist/js/*.tgz -C .repo
      - name: Move build artifact out of the way
        run: mv dist dist.old
      - name: Create js artifact
        run: cd .repo && npx projen package:js
      - name: Collect js artifact
        run: mv .repo/dist dist
